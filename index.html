<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <model-viewer 
    src="https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTF-Sample-Assets/Models/Sparrow/glTF-Binary/Sparrow.glb" 
    camera-controls 
    tone-mapping="neutral" 
    shadow-intensity="1" 
    background-color="#5F9E8F">
  </model-viewer>
</body>
</html>
